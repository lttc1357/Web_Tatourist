<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Us</title>
  <link rel="stylesheet" href="/CSS/6-9/REGISTER.css" />
  <script src="/JS/6-9/REGISTER.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/PROJECT CUỐI KÌ/CSS/header.css">
  <link rel="stylesheet" href="/CSS/footer.css">

<link 
  rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
  integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
  crossorigin="anonymous" 
  referrerpolicy="no-referrer" 
/>
</head>
<body>
  <header class="site-header">  
    <div class="logo">
      <a href="/HTML/HOME.html"><img src="/PROJECT CUỐI KÌ/IMAGES/HOME/logo.png" alt="Tatourist Logo" /></a>
    </div>
    <nav class="main-nav">
      <ul>
        <li><a href="/HTML/ARTIST.html">ARTIST</a></li>
        <li><a href="/HTML/4-6/4.html">STYLE</a></li> 
        <li><a href="/HTML/4-6/5.html">BLOG</a></li>
        <li><a href="/HTML/BOOKING.html">BOOKING</a></li>
        <li><a href="/HTML/6-9/about.html">ABOUT</a></li>
        <li><a href="/HTML/6-9/REGISTER.html"><img src="/PROJECT CUỐI KÌ/IMAGES/HOME/accont.png" alt="Tatourist Logo" /></a></li>
      </ul>
    </nav>
  </header>
  <div class="container">
    <div class="background-top">
      <img class="background-image" src="/IMAGES/ACCOUNT/REGISTER/1.png" alt="Tattoo Background">
    </div>

    <div class="form-section">
      <div class="form-left">
        <h1 class="title">JOIN US!</h1>

<div class="social-icons">
    <a href="https://www.instagram.com/cc.lttc/" title="Sign in with Google">
      <i class="fab fa-google icon google-icon"></i> 
    </a>
    <a href="https://www.facebook.com/nguyen.tuan.995160" title="Sign in with Facebook">
      <i class="fab fa-facebook-f icon facebook-icon"></i> 
    </a>
  </div>
      </div>

      <div class="form-right">
        <form id="auth-form">
          <input type="text" id="name" placeholder="Name" class="input-field" style="display: block;" />
          <input type="email" id="mail" placeholder="Mail" class="input-field" />

          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Password" class="input-field" />
            <i class="fa-solid fa-eye eye-icon" id="togglePassword" title="Show/Hide Password"></i>          </div>          
        <!-- Thêm class "register-only" cho các trường chỉ hiện khi đăng ký -->
<div class="input-group register-only">
    <input type="tel" id="phone" placeholder="Phone Number" class="input-field" />
  </div>
  
<!-- Sửa phần gender và terms checkbox -->
<div class="input-group gender-group register-only">
    <span class="gender-label">Gender</span>
    <div class="gender-options">
      <label class="gender-option">
        <input type="radio" name="gender" value="male" checked />
        <div class="gender-card">
          <i class="fas fa-mars gender-icon"></i>
          <span class="gender-text">Male</span>
        </div>
      </label>
      <label class="gender-option">
        <input type="radio" name="gender" value="female" />
        <div class="gender-card">
          <i class="fas fa-venus gender-icon"></i>
          <span class="gender-text">Female</span>
        </div>
      </label>
    </div>
  </div>
  <label class="terms-checkbox">
    <input type="checkbox" id="terms" required />
    <span class="checkmark"></span>
    <span class="terms-text">I agree to the Terms and Privacy Policy</span>
  </label>

          <div class="button-group">
            <button type="button" class="btn" id="signupBtn">Sign up</button>
            <button type="button" class="btn" id="signinBtn">Sign in</button>
          </div>
        </form>
      </div>
    </div>
    

    <div class="quote-section">
      <p>“OUR LOVE ON YOUR SKIN”</p>
      <div class="tribal">
        <img src="/IMAGES/ACCOUNT/REGISTER/2.png" alt="Tribal" />
      </div>
    </div>
  </div>
  <footer class="footer">
        <!-- Contact Info Column -->
        <div class="footer-column">
            <h3 class="footer-title">CONTACT</h3>
            <p class="footer-info">tatourist20@gmail.com</p>
            <p class="footer-info">+84 099 798 550</p>
        </div>
        
        <!-- Brand Info Column -->
        <div class="footer-column center-column">
            <h3 class="footer-title">TATOURIST</h3>
            <p class="footer-info">Since</p>
            <p class="footer-info">2020-2024</p>
        </div>
        
        <!-- Social Icons Column -->
         <div class="footer-column" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="social-icons">
                <a href="https://www.instagram.com/cc.lttc/" class="social-icon">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.facebook.com/lttcccc" class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </a> 
                <a href="https://www.facebook.com/nguyen.tuan.995160" class="social-icon">
                    <i class="fas fa-globe"></i>
                </a>
            </div>
            <!-- Logo -->
            <img src="/IMAGES/HOME/logo_metal.png" alt="Tatourist Logo" class="footer-logo">
        </div>
    </footer>

</body>
</html>
