     <div class="profile-container">
        <!-- Phần tiêu đề -->
        <div class="profile-header">
            <h1>XIN CHÀO</h1>
            <h2 id="user-name"></h2>
        </div>

        <!-- Phần menu -->
        <div class="profile-menu">
            <button class="menu-button active">Thông tin cá nhân</button>
            <button class="menu-button">Booking</button>
        </div>

        <!-- Phần thông tin -->
        <div class="profile-info-section">
            <div class="info-header">
                <h3>THÔNG TIN CHUNG</h3>
                <button class="edit-button" onclick="logout()">Đăng xuất</button>
            </div>
            
            <div class="info-grid">
                <div class="info-row">
                    <span class="info-label">Tên</span>
                    <span class="info-value" id="profile-name"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Mail</span>
                    <span class="info-value" id="profile-email"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Số điện thoại</span>
                    <span class="info-value" id="profile-phone"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Giới tính</span>
                    <span class="info-value" id="profile-gender"></span>
                </div>
            </div>
        </div> 

<!-- Tab Booking -->
<div class="profile-booking-section">
    <div class="info-header">
        <h3>THÔNG TIN ĐẶT LỊCH</h3>
    </div>
    <div class="info-grid" id="booking-info">
        <div class="info-row">
            <span class="info-label">Nghệ sĩ</span>
            <span class="info-value" id="booking-artist"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Ngày</span>
            <span class="info-value" id="booking-date"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Giờ</span>
            <span class="info-value" id="booking-time"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Phong cách</span>
            <span class="info-value" id="booking-style"></span>
        </div>
        <div class="info-row">
            <span class="info-label">Phương thức thanh toán</span>
            <span class="info-value" id="booking-method"></span>
        </div>
    </div>

    <!-- Chỉ 1 khối này thôi -->
     <div id="no-booking-message" style="display: none; text-align: center; margin-top: 20px;">
        <p>Không có thông tin đặt lịch.</p>
        <button onclick="window.location.href='/HTML/BOOKING.html'" class="edit-button">Đặt lịch ngay</button>
    </div>
</div>

</div>

<!-- Nút quay lại (di chuyển ra ngoài tabs) -->
